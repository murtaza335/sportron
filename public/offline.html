<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sportron - offline</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;box-sizing:border-box;text-align:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fff;color:#111}
  @media (prefers-color-scheme:dark){body{background:#000;color:#f5f5f5}}
  img{width:72px;height:72px;border-radius:16px}
  h1{font-size:20px;margin:0}
  p{margin:0;opacity:.7;max-width:320px}
  button{margin-top:8px;padding:10px 20px;border:0;border-radius:10px;font-size:16px;font-weight:600;background:#111;color:#fff;cursor:pointer}
  @media (prefers-color-scheme:dark){button{background:#f5f5f5;color:#000}}
</style>
</head>
<body>
  <img src="/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Sportron needs a connection. Check your internet and try again.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
